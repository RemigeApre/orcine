services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orcine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orcine_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      DATABASE_URL: postgresql://orcine:${POSTGRES_PASSWORD}@postgres:5432/orcine_db
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      - postgres
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
